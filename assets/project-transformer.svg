<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Transformer, From Scratch — Encoder–decoder, multi-head attention, and positional encoding in TensorFlow 2.x.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#0C1324"/>
      <stop offset="1" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.075"/>
    </pattern>
    <filter id="blur18" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="560" height="280" rx="22"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes scan {
        0% { transform: translateX(0); }
        100% { transform: translateX(700px); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-14px, 10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.25); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -256; }
      }
      @keyframes attention {
        0%, 100% { opacity: 0.18; }
        50% { opacity: 0.7; }
      }

      .scan { animation: scan 7s linear infinite; }
      .glow { transform-box: fill-box; transform-origin: center; animation: drift 12s ease-in-out infinite; }
      .nodeHalo { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
      .flow { animation: flow 5s linear infinite; }
      .attention { animation: attention 4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .scan, .glow, .nodeHalo, .flow, .attention { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="560" height="280" fill="url(#bg)"/>
    <rect width="560" height="280" fill="url(#dots)" opacity="0.6"/>
    <circle class="glow" cx="470" cy="74" r="80" fill="url(#glow)" filter="url(#blur18)"/>

    <rect x="22" y="0" width="516" height="2" fill="url(#topline)"/>
    <rect class="scan" x="-160" y="0" width="160" height="2" fill="#C4B5FD" opacity="0.55"/>

    
    <g>
      <circle cx="478" cy="104" r="54" fill="#8B5CF6" fill-opacity="0.08" filter="url(#blur18)"/>
      <rect x="428" y="54" width="14" height="14" rx="3" fill="#8B5CF6" fill-opacity="0.90"/>
      <rect x="448" y="54" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="468" y="54" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="488" y="54" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="508" y="54" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="428" y="74" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="448" y="74" width="14" height="14" rx="3" fill="#8B5CF6" fill-opacity="0.80"/>
      <rect x="468" y="74" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="488" y="74" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="508" y="74" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="428" y="94" width="14" height="14" rx="3" fill="#C4B5FD" fill-opacity="0.28" class="attention" style="animation-delay:0s"/>
      <rect x="448" y="94" width="14" height="14" rx="3" fill="#C4B5FD" fill-opacity="0.28" class="attention" style="animation-delay:0.18s"/>
      <rect x="468" y="94" width="14" height="14" rx="3" fill="#8B5CF6" fill-opacity="0.70"/>
      <rect x="488" y="94" width="14" height="14" rx="3" fill="#C4B5FD" fill-opacity="0.28" class="attention" style="animation-delay:0.54s"/>
      <rect x="508" y="94" width="14" height="14" rx="3" fill="#C4B5FD" fill-opacity="0.28" class="attention" style="animation-delay:0.72s"/>
      <rect x="428" y="114" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="448" y="114" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="468" y="114" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="488" y="114" width="14" height="14" rx="3" fill="#8B5CF6" fill-opacity="0.60"/>
      <rect x="508" y="114" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="428" y="134" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="448" y="134" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="468" y="134" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="488" y="134" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.50"/>
      <rect x="508" y="134" width="14" height="14" rx="3" fill="#8B5CF6" fill-opacity="0.50"/>
      <text x="478" y="174" text-anchor="middle" class="mono" font-size="8" letter-spacing="2" fill="#64748B">SELF-ATTENTION</text>
    </g>

    <text x="32" y="44" class="mono" font-size="11" fill="#475569">02</text>
    <text x="64" y="44" class="sans" font-size="10" font-weight="700" letter-spacing="2" fill="#8B5CF6">DEEP LEARNING</text>
    <line x1="64" y1="51" x2="168" y2="51" stroke="#8B5CF6" stroke-opacity="0.25"/>

    <text x="32" y="92" class="sans" font-size="27" font-weight="700" letter-spacing="-0.6" fill="#F1F5F9">Transformer, From Scratch</text>
    <text x="32" y="124" class="sans" font-size="13.5" fill="#94A3B8">Encoder–decoder, multi-head attention, and</text>
    <text x="32" y="144" class="sans" font-size="13.5" fill="#94A3B8">positional encoding in TensorFlow 2.x.</text>

    <text x="32" y="194" class="mono" font-size="9" letter-spacing="1.8" fill="#475569">STACK</text>
    <text x="32" y="214" class="mono" font-size="12" fill="#CBD5E1">TensorFlow · Seq2Seq · self-attention</text>

    <line x1="32" y1="234" x2="528" y2="234" stroke="#1E293B"/>

    <circle cx="38" cy="254" r="3.5" fill="#8B5CF6"/>
    <text x="50" y="258" class="mono" font-size="10.5" fill="#64748B">Python · Jupyter</text>
    <text x="528" y="258" text-anchor="end" class="mono" font-size="10.5" fill="#8B5CF6">View repository →</text>

    <rect x="0.5" y="0.5" width="559" height="279" rx="22" fill="none" stroke="#1E293B"/>
  </g>
</svg>
