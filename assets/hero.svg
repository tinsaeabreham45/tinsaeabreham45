<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tinsae Abreham, AI Engineer specializing in applied mathematics, LLM systems, and production AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0C1324"/>
      <stop offset="1" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E6F7FF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22D3EE" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.65"/>
      <stop offset="0.85" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.35" stop-color="#22D3EE"/>
      <stop offset="0.72" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#0B1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.09"/>
    </pattern>
    <filter id="blur64" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="heroClip">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
    <clipPath id="lineClip">
      <rect x="72" y="390" width="1056" height="4" rx="2"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes driftCyan {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(46px, 26px) scale(1.08); }
      }
      @keyframes driftViolet {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-38px, -22px) scale(1.05); }
      }
      @keyframes driftBlue {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(24px, -18px) scale(1.1); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.08; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.35); }
      }
      @keyframes blink {
        0%, 42% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineScan {
        0% { transform: translateX(0); }
        100% { transform: translateX(1400px); }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .ringOuter { transform-box: view-box; transform-origin: 1000px 210px; animation: spin 54s linear infinite; }
      .ringMiddle { transform-box: view-box; transform-origin: 1000px 210px; animation: spinReverse 38s linear infinite; }
      .nodePulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.8s ease-in-out infinite; }
      .nodeHalo { transform-box: fill-box; transform-origin: center; animation: nodeGlow 4.8s ease-in-out infinite; }
      .cursor { animation: blink 1.15s step-end infinite; }
      .lineScan { animation: lineScan 7.5s linear infinite; }
      .badgeFloat { transform-box: fill-box; transform-origin: center; animation: floatBadge 6s ease-in-out infinite; }
      .driftCyan { transform-box: fill-box; transform-origin: center; animation: driftCyan 18s ease-in-out infinite; }
      .driftViolet { transform-box: fill-box; transform-origin: center; animation: driftViolet 22s ease-in-out infinite; }
      .driftBlue { transform-box: fill-box; transform-origin: center; animation: driftBlue 26s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .ringOuter, .ringMiddle, .nodePulse, .nodeHalo, .cursor, .lineScan, .badgeFloat,
        .driftCyan, .driftViolet, .driftBlue { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#dots)" opacity="0.55"/>

    <!-- ambient aurora -->
    <ellipse class="driftCyan" cx="210" cy="70" rx="280" ry="170" fill="url(#auroraCyan)" filter="url(#blur64)"/>
    <ellipse class="driftViolet" cx="560" cy="390" rx="320" ry="170" fill="url(#auroraViolet)" filter="url(#blur64)"/>
    <ellipse class="driftBlue" cx="1010" cy="60" rx="230" ry="130" fill="url(#auroraBlue)" filter="url(#blur64)"/>

    <!-- location / edition -->
    <text x="1128" y="48" text-anchor="end" class="mono" font-size="11" letter-spacing="2.4" fill="#64748B">ADDIS ABABA · UTC+3</text>

    <!-- eyebrow -->
    <g>
      <rect x="72" y="60" width="9" height="9" rx="2" fill="#22D3EE"/>
      <text x="94" y="70" class="mono" font-size="12" letter-spacing="3.4" fill="#67E8F9">AI ENGINEER / APPLIED MATHEMATICS</text>
    </g>

    <!-- name -->
    <text x="72" y="158" class="sans" font-size="66" font-weight="800" letter-spacing="-2.2" fill="url(#name)">TINSAE ABREHAM</text>

    <!-- subtitle -->
    <text x="74" y="198" class="sans" font-size="20" font-weight="400" letter-spacing="0.2" fill="#CBD5E1">Applied mathematics <tspan fill="#64748B">·</tspan> LLM systems <tspan fill="#64748B">·</tspan> production AI</text>

    <!-- terminal line -->
    <g>
      <rect x="72" y="230" width="650" height="52" rx="14" fill="#0A0F1E" fill-opacity="0.9" stroke="#1E293B"/>
      <circle cx="96" cy="256" r="4" fill="#F87171" opacity="0.8"/>
      <circle cx="112" cy="256" r="4" fill="#FBBF24" opacity="0.8"/>
      <circle cx="128" cy="256" r="4" fill="#34D399" opacity="0.8"/>
      <text x="150" y="261" class="mono" font-size="15" fill="#67E8F9">$</text>
      <text x="172" y="261" class="mono" font-size="15" fill="#CBD5E1">building agents that reason, retrieve, and ship<tspan class="cursor" fill="#22D3EE">▌</tspan></text>
    </g>

    <!-- focus pills -->
    <g class="sans" font-size="11" font-weight="600" letter-spacing="1.6">
      <g>
        <rect x="72" y="308" width="128" height="34" rx="17" fill="#0A0F1E" fill-opacity="0.85" stroke="#1E293B"/>
        <circle cx="90" cy="325" r="3.5" fill="#22D3EE"/>
        <text x="102" y="329" fill="#94A3B8">AI AGENTS</text>
      </g>
      <g>
        <rect x="212" y="308" width="142" height="34" rx="17" fill="#0A0F1E" fill-opacity="0.85" stroke="#1E293B"/>
        <circle cx="230" cy="325" r="3.5" fill="#8B5CF6"/>
        <text x="242" y="329" fill="#94A3B8">RAG SYSTEMS</text>
      </g>
      <g>
        <rect x="366" y="308" width="150" height="34" rx="17" fill="#0A0F1E" fill-opacity="0.85" stroke="#1E293B"/>
        <circle cx="384" cy="325" r="3.5" fill="#34D399"/>
        <text x="396" y="329" fill="#94A3B8">APPLIED MATH</text>
      </g>
    </g>

    <!-- orbital identity mark -->
    <g>
      <circle cx="1000" cy="210" r="104" fill="url(#coreGlow)" filter="url(#blur40)"/>

      <!-- connection lines -->
      <g stroke="#22D3EE" stroke-opacity="0.12" stroke-width="1">
        <line x1="1000" y1="210" x2="1075" y2="80"/>
        <line x1="1000" y1="210" x2="1141" y2="261"/>
        <line x1="1000" y1="210" x2="870" y2="285"/>
        <line x1="1000" y1="210" x2="928" y2="124"/>
        <line x1="1000" y1="210" x2="1038" y2="315"/>
      </g>

      <circle class="ringOuter" cx="1000" cy="210" r="150" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="1 10" stroke-linecap="round"/>
      <circle class="ringMiddle" cx="1000" cy="210" r="112" fill="none" stroke="#475569" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="30 14" stroke-linecap="round"/>
      <circle cx="1000" cy="210" r="79" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1"/>

      <!-- orbiting nodes -->
      <g>
        <circle class="nodeHalo" cx="1075" cy="80" r="11" fill="#22D3EE"/>
        <circle class="nodePulse" cx="1075" cy="80" r="4.5" fill="#67E8F9"/>
        <circle class="nodeHalo" cx="1141" cy="261" r="11" fill="#8B5CF6"/>
        <circle class="nodePulse" cx="1141" cy="261" r="4.5" fill="#A78BFA"/>
        <circle class="nodeHalo" cx="870" cy="285" r="11" fill="#3B82F6"/>
        <circle class="nodePulse" cx="870" cy="285" r="4.5" fill="#60A5FA"/>
        <circle class="nodeHalo" cx="928" cy="124" r="9" fill="#8B5CF6"/>
        <circle class="nodePulse" cx="928" cy="124" r="3.5" fill="#C4B5FD"/>
        <circle class="nodeHalo" cx="1038" cy="315" r="9" fill="#22D3EE"/>
        <circle class="nodePulse" cx="1038" cy="315" r="3.5" fill="#67E8F9"/>
      </g>

      <!-- core -->
      <circle cx="1000" cy="210" r="62" fill="url(#core)" stroke="#A5F3FC" stroke-opacity="0.28" stroke-width="1.5"/>
      <circle cx="1000" cy="210" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="1000" y="224" text-anchor="middle" class="sans" font-size="38" font-weight="800" letter-spacing="1" fill="#FFFFFF">TA</text>
    </g>

    <!-- floating status badge -->
    <g class="badgeFloat">
      <rect x="1042" y="350" width="126" height="30" rx="15" fill="#0A0F1E" fill-opacity="0.9" stroke="#1E293B"/>
      <circle cx="1058" cy="365" r="3.5" fill="#34D399"/>
      <circle cx="1058" cy="365" r="7" fill="#34D399" opacity="0.18"/>
      <text x="1070" y="369" class="mono" font-size="10" letter-spacing="1.2" fill="#94A3B8">OPEN TO ROLES</text>
    </g>

    <!-- footer line -->
    <g clip-path="url(#lineClip)">
      <rect x="72" y="390" width="1056" height="2" fill="url(#line)"/>
      <rect class="lineScan" x="72" y="390" width="180" height="2" fill="#A5F3FC" opacity="0.65"/>
    </g>

    <rect width="1200" height="420" fill="url(#vignette)"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="28" fill="none" stroke="#1E293B"/>
  </g>
</svg>
