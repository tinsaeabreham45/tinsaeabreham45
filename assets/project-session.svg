<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Session-Aware Recommender — Co-occurrence graph over 1.9M sessions, ranking the next item with LLM explanations at MRR 0.2503.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#0C1324"/>
      <stop offset="1" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.075"/>
    </pattern>
    <filter id="blur18" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="560" height="280" rx="22"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes scan {
        0% { transform: translateX(0); }
        100% { transform: translateX(700px); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-14px, 10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.28); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -200; }
      }
      @keyframes highlight {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      .scan { animation: scan 7s linear infinite; }
      .glow { transform-box: fill-box; transform-origin: center; animation: drift 12s ease-in-out infinite; }
      .sessionHalo { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
      .flow { animation: flow 5s linear infinite; }
      .topBox { animation: highlight 3.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .scan, .glow, .sessionHalo, .flow, .topBox { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="560" height="280" fill="url(#bg)"/>
    <rect width="560" height="280" fill="url(#dots)" opacity="0.6"/>
    <circle class="glow" cx="470" cy="74" r="80" fill="url(#glow)" filter="url(#blur18)"/>

    <rect x="22" y="0" width="516" height="2" fill="url(#topline)"/>
    <rect class="scan" x="-160" y="0" width="160" height="2" fill="#5EEAD4" opacity="0.55"/>

    <g>
      <g stroke="#2DD4BF" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="4 6" class="flow">
        <line x1="468" y1="104" x2="420" y2="58"/>
        <line x1="468" y1="104" x2="512" y2="50"/>
        <line x1="468" y1="104" x2="540" y2="108"/>
        <line x1="468" y1="104" x2="504" y2="150"/>
        <line x1="468" y1="104" x2="432" y2="150"/>
        <line x1="468" y1="104" x2="466" y2="30"/>
      </g>

      <g fill="#2DD4BF">
        <rect x="415" y="53" width="10" height="10" rx="2" fill-opacity="0.55"/>
        <rect x="507" y="45" width="10" height="10" rx="2" fill-opacity="0.75"/>
        <rect x="504" y="145" width="10" height="10" rx="2" fill-opacity="0.55"/>
        <rect x="427" y="145" width="10" height="10" rx="2" fill-opacity="0.45"/>
        <rect x="461" y="25" width="10" height="10" rx="2" fill-opacity="0.35"/>
      </g>

      <circle class="sessionHalo" cx="468" cy="104" r="22" fill="#2DD4BF"/>
      <circle cx="468" cy="104" r="13" fill="#0B1120" stroke="#2DD4BF" stroke-opacity="0.9" stroke-width="1.6"/>
      <circle cx="468" cy="104" r="6" fill="#2DD4BF"/>
      <circle cx="468" cy="104" r="18" fill="none" stroke="#5EEAD4" stroke-opacity="0.3"/>

      <rect class="topBox" x="528" y="96" width="24" height="24" rx="4" fill="#2DD4BF" fill-opacity="0.08" stroke="#5EEAD4" stroke-width="1.2" stroke-dasharray="3 3"/>
      <rect x="535" y="103" width="10" height="10" rx="2" fill="#5EEAD4" fill-opacity="0.9"/>
      <text x="540" y="86" text-anchor="middle" class="mono" font-size="8" letter-spacing="1.2" fill="#5EEAD4">TOP-1</text>

      <text x="468" y="184" text-anchor="middle" class="mono" font-size="8" letter-spacing="1.6" fill="#64748B">SESSION → ITEM</text>
    </g>

    <text x="32" y="44" class="mono" font-size="11" fill="#475569">03</text>
    <text x="64" y="44" class="sans" font-size="10" font-weight="700" letter-spacing="2" fill="#2DD4BF">RECOMMENDER SYSTEMS</text>
    <line x1="64" y1="51" x2="244" y2="51" stroke="#2DD4BF" stroke-opacity="0.25"/>

    <text x="32" y="92" class="sans" font-size="27" font-weight="700" letter-spacing="-0.6" fill="#F1F5F9">Session-Based Recommender</text>
    <text x="32" y="124" class="sans" font-size="13.5" fill="#94A3B8">Mines co-occurrence graphs across 1.9M sessions</text>
    <text x="32" y="144" class="sans" font-size="13.5" fill="#94A3B8">and ranks the next item with LLM explanations.</text>

    <text x="32" y="194" class="mono" font-size="9" letter-spacing="1.8" fill="#475569">STACK</text>
    <text x="32" y="214" class="mono" font-size="12" fill="#CBD5E1">Neo4j · Flask · LLM explanations</text>

    <line x1="32" y1="234" x2="528" y2="234" stroke="#1E293B"/>

    <circle cx="38" cy="254" r="3.5" fill="#2DD4BF"/>
    <text x="50" y="258" class="mono" font-size="10.5" fill="#64748B">MRR 0.2503 · 1.9M sessions</text>
    <text x="528" y="258" text-anchor="end" class="mono" font-size="10.5" fill="#2DD4BF">View repository →</text>

    <rect x="0.5" y="0.5" width="559" height="279" rx="22" fill="none" stroke="#1E293B"/>
  </g>
</svg>
