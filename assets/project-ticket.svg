<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="LLM Support Triage — Clusters recurring tickets with pgvector, verifies root causes, gates alerts by approval.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#0C1324"/>
      <stop offset="1" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.075"/>
    </pattern>
    <filter id="blur18" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="560" height="280" rx="22"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes scan {
        0% { transform: translateX(0); }
        100% { transform: translateX(700px); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-14px, 10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.25); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -256; }
      }
      @keyframes attention {
        0%, 100% { opacity: 0.18; }
        50% { opacity: 0.7; }
      }

      .scan { animation: scan 7s linear infinite; }
      .glow { transform-box: fill-box; transform-origin: center; animation: drift 12s ease-in-out infinite; }
      .nodeHalo { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
      .flow { animation: flow 5s linear infinite; }
      .attention { animation: attention 4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .scan, .glow, .nodeHalo, .flow, .attention { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="560" height="280" fill="url(#bg)"/>
    <rect width="560" height="280" fill="url(#dots)" opacity="0.6"/>
    <circle class="glow" cx="470" cy="74" r="80" fill="url(#glow)" filter="url(#blur18)"/>

    <rect x="22" y="0" width="516" height="2" fill="url(#topline)"/>
    <rect class="scan" x="-160" y="0" width="160" height="2" fill="#67E8F9" opacity="0.55"/>

    
    <g>
      <g stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1">
        <line x1="473" y1="106" x2="424" y2="66"/>
        <line x1="473" y1="106" x2="520" y2="62"/>
        <line x1="473" y1="106" x2="536" y2="118"/>
        <line x1="473" y1="106" x2="498" y2="152"/>
        <line x1="473" y1="106" x2="424" y2="142"/>
        <line x1="473" y1="106" x2="454" y2="48"/>
      </g>
      <circle class="nodeHalo" cx="473" cy="106" r="18" fill="#22D3EE"/>
      <circle cx="473" cy="106" r="9" fill="#22D3EE"/>
      <circle cx="473" cy="106" r="13" fill="none" stroke="#67E8F9" stroke-opacity="0.35"/>
      <g fill="#64748B">
        <circle cx="424" cy="66" r="4"/>
        <circle cx="424" cy="142" r="4"/>
        <circle cx="454" cy="48" r="3.5"/>
        <circle cx="536" cy="118" r="4"/>
        <circle cx="498" cy="152" r="3.5"/>
      </g>
      <g>
        <circle cx="520" cy="62" r="9" fill="#0B1120" stroke="#67E8F9" stroke-opacity="0.7"/>
        <path d="M 516 62 l 3 3 l 6 -7" fill="none" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="478" y="174" text-anchor="middle" class="mono" font-size="8" letter-spacing="1.6" fill="#64748B">HUMAN APPROVAL</text>
    </g>

    <text x="32" y="44" class="mono" font-size="11" fill="#475569">04</text>
    <text x="64" y="44" class="sans" font-size="10" font-weight="700" letter-spacing="2" fill="#22D3EE">LLM SYSTEMS</text>
    <line x1="64" y1="51" x2="152" y2="51" stroke="#22D3EE" stroke-opacity="0.25"/>

    <text x="32" y="92" class="sans" font-size="27" font-weight="700" letter-spacing="-0.6" fill="#F1F5F9">LLM Support Triage</text>
    <text x="32" y="124" class="sans" font-size="13.5" fill="#94A3B8">Clusters synthetic tickets with pgvector,</text>
    <text x="32" y="144" class="sans" font-size="13.5" fill="#94A3B8">verifies root causes, gates alerts by approval.</text>

    <text x="32" y="194" class="mono" font-size="9" letter-spacing="1.8" fill="#475569">STACK</text>
    <text x="32" y="214" class="mono" font-size="12" fill="#CBD5E1">pgvector · n8n · human-in-the-loop</text>

    <line x1="32" y1="234" x2="528" y2="234" stroke="#1E293B"/>

    <circle cx="38" cy="254" r="3.5" fill="#22D3EE"/>
    <text x="50" y="258" class="mono" font-size="10.5" fill="#64748B">Python · n8n · pgvector</text>
    <text x="528" y="258" text-anchor="end" class="mono" font-size="10.5" fill="#22D3EE">View repository →</text>

    <rect x="0.5" y="0.5" width="559" height="279" rx="22" fill="none" stroke="#1E293B"/>
  </g>
</svg>
