<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-label="Build with rigor. Ship with taste. Open to AI engineering roles and research collaborations.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="footerClip">
      <rect width="1200" height="132" rx="22"/>
    </clipPath>
    <clipPath id="lineClip">
      <rect x="48" y="0" width="1104" height="3"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @keyframes scan {
        0% { transform: translateX(0); }
        100% { transform: translateX(1400px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.8; }
      }
      .scan { animation: scan 8s linear infinite; }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .scan, .pulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="132" fill="url(#bg)"/>
    <rect width="1200" height="132" fill="url(#dots)" opacity="0.6"/>

    <g clip-path="url(#lineClip)">
      <rect x="48" y="0" width="1104" height="2" fill="url(#line)"/>
      <rect class="scan" x="48" y="0" width="160" height="2" fill="#A5F3FC" opacity="0.6"/>
    </g>

    <text x="64" y="44" class="mono" font-size="10" letter-spacing="2.6" fill="#67E8F9">THE NEXT BUILD</text>
    <text x="64" y="84" class="sans" font-size="30" font-weight="700" letter-spacing="-0.8" fill="url(#text)">Build with rigor. Ship with taste.</text>
    <text x="66" y="108" class="sans" font-size="13" fill="#94A3B8">Open to AI engineering roles, research collaborations, and ambitious LLM products.</text>

    <g class="pulse">
      <circle cx="1110" cy="40" r="3.5" fill="#34D399"/>
      <circle cx="1110" cy="40" r="9" fill="none" stroke="#34D399" stroke-opacity="0.4"/>
    </g>
    <text x="1124" y="45" class="mono" font-size="10" letter-spacing="1.4" fill="#64748B">AVAILABLE</text>
    <text x="1136" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#64748B">ADDIS ABABA, ETHIOPIA</text>
    <text x="1136" y="106" text-anchor="end" class="mono" font-size="10.5" fill="#64748B">UTC+3 · 2026</text>

    <rect x="0.5" y="0.5" width="1199" height="131" rx="22" fill="none" stroke="#1E293B"/>
  </g>
</svg>
