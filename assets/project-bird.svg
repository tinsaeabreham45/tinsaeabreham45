<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Bird Detection &amp; Tracking — Real-time YOLOv11 detection with Deep SORT identities, shipped as a Gradio demo.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#0C1324"/>
      <stop offset="1" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#34D399" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#6EE7B7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.075"/>
    </pattern>
    <filter id="blur18" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="560" height="280" rx="22"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }

      @keyframes scan {
        0% { transform: translateX(0); }
        100% { transform: translateX(700px); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-14px, 10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.25); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -256; }
      }
      @keyframes attention {
        0%, 100% { opacity: 0.18; }
        50% { opacity: 0.7; }
      }

      .scan { animation: scan 7s linear infinite; }
      .glow { transform-box: fill-box; transform-origin: center; animation: drift 12s ease-in-out infinite; }
      .nodeHalo { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
      .flow { animation: flow 5s linear infinite; }
      .attention { animation: attention 4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .scan, .glow, .nodeHalo, .flow, .attention { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="560" height="280" fill="url(#bg)"/>
    <rect width="560" height="280" fill="url(#dots)" opacity="0.6"/>
    <circle class="glow" cx="470" cy="74" r="80" fill="url(#glow)" filter="url(#blur18)"/>

    <rect x="22" y="0" width="516" height="2" fill="url(#topline)"/>
    <rect class="scan" x="-160" y="0" width="160" height="2" fill="#6EE7B7" opacity="0.55"/>

    
    <g>
      <path d="M 408 146 C 438 138, 448 104, 476 104 S 516 72, 544 58"
            fill="none" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 5" class="flow"/>
      <rect x="438" y="52" width="78" height="70" rx="4" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.4"/>
      <g stroke="#6EE7B7" stroke-width="2" stroke-linecap="round">
        <path d="M 438 62 v -10 h 12"/>
        <path d="M 516 62 v -10 h -12"/>
        <path d="M 438 112 v 10 h 12"/>
        <path d="M 516 112 v 10 h -12"/>
      </g>
      <text x="444" y="48" class="mono" font-size="9" fill="#6EE7B7">ID 04</text>
      <rect x="476" y="88" width="54" height="45" rx="3" fill="none" stroke="#6EE7B7" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="482" y="84" class="mono" font-size="8" fill="#6EE7B7" fill-opacity="0.7">ID 07</text>
      <g stroke="#64748B" stroke-opacity="0.4" stroke-width="1">
        <line x1="477" y1="52" x2="477" y2="122"/>
        <line x1="438" y1="87" x2="516" y2="87"/>
      </g>
      <circle cx="477" cy="87" r="3" fill="none" stroke="#6EE7B7" stroke-opacity="0.7"/>
      <g fill="#6EE7B7" fill-opacity="0.6">
        <circle cx="438" cy="52" r="2"/>
        <circle cx="516" cy="122" r="2"/>
        <circle cx="476" cy="133" r="2"/>
      </g>
    </g>

    <text x="32" y="44" class="mono" font-size="11" fill="#475569">04</text>
    <text x="64" y="44" class="sans" font-size="10" font-weight="700" letter-spacing="2" fill="#34D399">APPLIED VISION</text>
    <line x1="64" y1="51" x2="176" y2="51" stroke="#34D399" stroke-opacity="0.25"/>

    <text x="32" y="92" class="sans" font-size="27" font-weight="700" letter-spacing="-0.6" fill="#F1F5F9">Bird Detection &amp; Tracking</text>
    <text x="32" y="124" class="sans" font-size="13.5" fill="#94A3B8">Real-time YOLOv11 detection with Deep SORT</text>
    <text x="32" y="144" class="sans" font-size="13.5" fill="#94A3B8">identities, shipped as a Gradio demo.</text>

    <text x="32" y="194" class="mono" font-size="9" letter-spacing="1.8" fill="#475569">STACK</text>
    <text x="32" y="214" class="mono" font-size="12" fill="#CBD5E1">YOLOv11 · Deep SORT · Gradio</text>

    <line x1="32" y1="234" x2="528" y2="234" stroke="#1E293B"/>

    <circle cx="38" cy="254" r="3.5" fill="#34D399"/>
    <text x="50" y="258" class="mono" font-size="10.5" fill="#64748B">Python · OpenCV</text>
    <text x="528" y="258" text-anchor="end" class="mono" font-size="10.5" fill="#34D399">View repository →</text>

    <rect x="0.5" y="0.5" width="559" height="279" rx="22" fill="none" stroke="#1E293B"/>
  </g>
</svg>
